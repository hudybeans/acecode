name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  macos-installer-tests:
    name: macos-installer-tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test native installer and both UI architectures
        run: bash tests/scripts/macos_installer_test.sh

      - name: Test offline macOS release scripts
        run: |
          python3 tests/scripts/macos_installer_release_test.py
          python3 tests/scripts/macos_portable_package_test.py
          bash tests/scripts/macos_release_scripts_test.sh

  web-tests:
    name: web-tests (linux-x64)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test channel protocol and npm packaging
        working-directory: .
        run: node --test assets/channels/whatsapp/protocol.test.mjs tests/scripts/npm_packages_test.mjs

      - name: Test web UI
        run: pnpm test

      - name: Test development launchers and complete release inventory
        working-directory: .
        run: |
          python3 -m unittest discover -s tests/scripts -p 'dev_*test.py'
          python3 tests/scripts/verify_release_assets_test.py
          python3 tests/scripts/verify_deepin_package_test.py

      - name: Build web UI
        run: pnpm build

  unit-tests:
    name: unit-tests (linux-x64)
    runs-on: ubuntu-22.04
    env:
      VCPKG_BINARY_SOURCES: clear;default,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwebkit2gtk-4.1-dev

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Test embedded frontend rebuild dependencies
        run: python3 tests/scripts/embedded_assets_rebuild_test.py

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-v2-test-ubuntu-22.04-x64-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            vcpkg-v2-test-ubuntu-22.04-x64-linux-

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_FEATURES=tests \
            -DBUILD_TESTING=ON \
            -DACECODE_BUILD_DESKTOP=ON

      - name: Build CLI, desktop and test binary
        shell: bash
        run: cmake --build build --target acecode acecode-desktop acecode_unit_tests

      - name: Validate bundled models.dev registry
        shell: bash
        run: ./build/acecode --validate-models-registry

      - name: Run ctest
        shell: bash
        run: ctest --test-dir build --output-on-failure
